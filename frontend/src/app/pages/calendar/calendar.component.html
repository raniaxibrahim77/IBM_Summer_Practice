<app-sidebar />

<app-header>
  <h1 class="header-title">Calendar</h1>
</app-header>

<main class="calendar-main">
  <div class="calendar-container">
    <div class="calendar-grid-layout">
      <app-calendar-grid
        [viewMonthLabel]="viewMonthLabel"
        [weekdayLabels]="weekdayLabels"
        [cells]="cells"
        (previousMonth)="previousMonth()"
        (nextMonth)="nextMonth()"
        (today)="goToToday()"
        (meetingClick)="goToMeeting($event)"
      />

      <div class="calendar-side">
        <app-task-reminders-panel
          [tasks]="taskReminders"
          (toggleTask)="toggleTask($event)"
        />
        <app-meeting-timeline
          [items]="timeline"
          (meetingClick)="goToMeeting($event)"
        />
      </div>
    </div>
  </div>
</main>
