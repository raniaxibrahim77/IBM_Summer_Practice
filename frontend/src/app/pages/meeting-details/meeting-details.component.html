<app-sidebar />

<app-header>
  <button routerLink="/meetings" class="back-link">
    <span class="material-symbols-outlined back-link__icon">arrow_back</span>
    Back to Meetings
  </button>
</app-header>

<main class="details-main">
  <div class="details-container">
    <!-- Header card -->
    <div class="header-card">
      <div>
        <div class="header-card__meta-row">
          <span class="status-badge" [ngClass]="statusClasses">{{ status }}</span>
          <span class="header-card__date">{{ date }}</span>
        </div>
        <h1 class="header-card__title">{{ title }}</h1>
        <button
          type="button"
          class="delete-meeting-button"
          (click)="openDeleteMeetingConfirmation()"
        >
          <span class="material-symbols-outlined"> delete </span>

          Delete meeting
        </button>
      </div>

      <!-- Attendee bubbles -->
      <app-meeting-attendees [meetingId]="meetingId" [refreshKey]="attendeesRefreshKey" />
    </div>

    <!-- Two column layout -->
    <div class="details-grid">
      <!-- LEFT: big Meeting Assistant -->
      <app-meeting-assistant [meetingId]="meetingId" />

      <!-- RIGHT: transcript download + AI summary (narrow) -->
      <div class="details-side">
        <div class="panel">
          <h2 class="panel__eyebrow">Meeting Transcript</h2>

          <app-meeting-transcript
            [meetingId]="meetingId"
            [meetingTitle]="title"
            [(transcriptText)]="transcriptText"
          />
        </div>

        <!-- AI Summary -->
        <app-meeting-summary
          [meetingId]="meetingId"
          [meetingTitle]="title"
          [meetingDate]="date"
          [transcriptText]="transcriptText"
          [(status)]="status"
          (attendeesRefreshRequested)="refreshAttendees()"
        />
      </div>
    </div>
  </div>

  <div class="back-row">
    <button routerLink="/meetings" class="back-btn">
      <span class="material-symbols-outlined">arrow_back</span>
      Back to Meetings
    </button>
  </div>
</main>

@if (showDeleteMeetingConfirmation) {
  <app-delete-meeting-confirmation
    [meetingId]="meetingId"
    [meetingTitle]="title"
    (cancelled)="closeDeleteMeetingConfirmation()"
    (meetingDeleted)="handleMeetingDeleted()"
  />
}
