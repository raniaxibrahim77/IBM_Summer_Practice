<main class="login-page">
  <!-- Login Form -->
  <section class="login-panel">
    <div class="login-panel__inner">
      <header class="login-header">
        <h1 class="login-title">Login</h1>
      </header>

      <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate" novalidate>

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon">person</span>
            <input
              id="username"
              type="text"
              formControlName="username"
              placeholder="Enter your username"
              autocomplete="username"
              class="form-input"
            />
          </div>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="password">Password</label>
          </div>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon">lock</span>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="current-password"
              class="form-input form-input--with-toggle"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              class="password-toggle"
            >
              <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>

        @if (loginError) {
          <p class="error-message" role="alert">{{ loginError }}</p>
        }

        <div class="submit-row">
          <button
            type="submit"
            [disabled]="submitting"
            class="submit-button"
          >
            {{ submitting ? 'Logging in…' : 'Login' }}
            <span class="material-symbols-outlined">arrow_forward</span>
          </button>
        </div>
      </form>

      <div class="register-prompt">
        <p class="register-text">
          Don't have an account?
          <button type="button" (click)="openRegisterModal()" class="register-link">Register here</button>
        </p>
      </div>

    </div>
  </section>

  <!-- Right Side: Full-height Brand Image -->
  <section class="brand-panel">
    <img
      class="brand-image"
      src="brand/background.jpg"
      alt="IBM AutoMinutes brand image"
    />
    <div class="brand-overlay">
      <div class="brand-overlay__inner">
        <h2 class="brand-title">ibm autominutes</h2>
      </div>
    </div>
  </section>

  <!-- Register Modal -->
  @if (showRegisterModal) {
    <div class="modal-backdrop" (click)="closeRegisterModal()">
      <div class="modal" (click)="$event.stopPropagation()">
        <div class="modal-header">
          <h2 class="modal-title">Register</h2>
          <button type="button" (click)="closeRegisterModal()" class="modal-close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>

        <form class="login-form" [formGroup]="registerForm" (ngSubmit)="onRegisterSubmit()" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-username">Username</label>
            <input
              id="reg-username"
              type="text"
              formControlName="username"
              placeholder="Pick a username"
              autocomplete="username"
              class="form-input form-input--plain"
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email</label>
            <input
              id="reg-email"
              type="email"
              formControlName="email"
              placeholder="Enter your email"
              autocomplete="email"
              class="form-input form-input--plain"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input
              id="reg-password"
              type="password"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="new-password"
              class="form-input form-input--plain"
          </div>

          @if (registerError) {
            <p class="error-message" role="alert">{{ registerError }}</p>
          }

          <button
            type="submit"
            [disabled]="registerSubmitting"
            class="submit-button"
          >
            {{ registerSubmitting ? 'Registering…' : 'Register' }}
          </button>
        </form>
      </div>
    </div>
  }  

</main>
