@if (sidebarService.isOpen()) {
  <div class="sidebar-overlay" (click)="sidebarService.close()"></div>
}

<aside
  class="sidebar"
  [class.sidebar--open]="sidebarService.isOpen()"
>
  <div class="sidebar__logo-row">
    <div class="sidebar__logo">
      <span class="material-symbols-outlined">dashboard</span>
    </div>
  </div>

  <nav class="sidebar__nav">
    <a routerLink="/dashboard" (click)="sidebarService.close()"
       routerLinkActive="nav-link--active"
       class="nav-link">
      <span class="material-symbols-outlined">home</span>
      <span class="nav-link__label">Home</span>
    </a>
    <a routerLink="/calendar" (click)="sidebarService.close()"
       routerLinkActive="nav-link--active"
       class="nav-link">
      <span class="material-symbols-outlined">calendar_today</span>
      <span class="nav-link__label">Calendar</span>
    </a>
    <a routerLink="/meetings" (click)="sidebarService.close()"
       routerLinkActive="nav-link--active"
       class="nav-link">
      <span class="material-symbols-outlined">groups</span>
      <span class="nav-link__label">Meetings</span>
    </a>
    <a routerLink="/settings"
      (click)="sidebarService.close()"
      routerLinkActive="nav-link--active"
      class="nav-link">
      <span class="material-symbols-outlined">settings</span>
      <span class="nav-link__label">Settings</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <button
      type="button"
      routerLink="/"
      (click)="logout()"
      class="nav-link nav-link--logout">
      <span class="material-symbols-outlined">logout</span>
      <span class="nav-link__label">Logout</span>
    </button>
  </div>
</aside>
